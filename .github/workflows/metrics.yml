# ═══════════════════════════════════════════════════════════════
# 📊 Generate GitHub Metrics Image
# Uses: lowlighter/metrics (https://github.com/lowlighter/metrics)
# Schedule: Every day at 1:00 AM UTC + on every push to main
# Requires: METRICS_TOKEN repo secret (PAT with read:user scope)
# ═══════════════════════════════════════════════════════════════

name: Generate Metrics

on:
  # Run on every push to main
  push:
    branches:
      - main

  # Run every day at 1 AM UTC (offset from snake to avoid conflicts)
  schedule:
    - cron: "0 1 * * *"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub personal access token (set as repo secret)
          token: ${{ secrets.METRICS_TOKEN }}

          # Who to generate metrics for
          user: vaibhav585

          # Output file
          filename: metrics.svg

          # Template & theme
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # ── Plugins ──────────────────────────────────────────────
          # Languages breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Contribution habits
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          # Isometric calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit

          # Lines of code changed
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
