# ═══════════════════════════════════════════════════════════════
# 🐍 Generate GitHub Contribution Snake Animation
# Uses: Platane/snk (https://github.com/Platane/snk)
# Schedule: Every day at midnight UTC + on every push to main
# ═══════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  # Run on every push to main
  push:
    branches:
      - main

  # Run every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate Snake (Light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vaibhav585
          outputs: dist/github-snake.svg
          

      - name: Generate Snake (Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vaibhav585
          outputs: dist/github-snake-dark.svg
          

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
